
name: Build NumWorks App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build python3 python3-pip nodejs npm

      - name: Build application
        run: |
          git clone --depth 1 https://github.com/numworks/epsilon.git
          echo "SDK checkout complete"
